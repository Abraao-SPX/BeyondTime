server.port=8080

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/beyondtime_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:beyondtime_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:beyondtime_dev_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.sql.init.mode=never

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# RF01 — Segurança JWT, Sessão Persistente (365d) e Recuperação de Senha
beyondtime.security.jwt.secret=${JWT_SECRET_KEY:beyondtime_dev_secret_key_for_local_testing_minimum_256_bits_2026_uninassau}
beyondtime.security.jwt.access-token-expiration-minutes=${JWT_ACCESS_EXPIRATION_MINUTES:15}
beyondtime.security.jwt.refresh-token-expiration-days=${JWT_REFRESH_EXPIRATION_DAYS:365}
beyondtime.security.password-reset.expiration-minutes=${PASSWORD_RESET_EXPIRATION_MINUTES:15}
beyondtime.security.password-reset.expose-debug-code=${PASSWORD_RESET_EXPOSE_DEBUG_CODE:false}
beyondtime.security.login.max-failed-attempts=${LOGIN_MAX_FAILED_ATTEMPTS:5}
beyondtime.security.login.lock-minutes=${LOGIN_LOCK_MINUTES:15}
beyondtime.security.login.ip-max-requests-per-minute=${LOGIN_IP_MAX_REQUESTS_PER_MINUTE:15}
beyondtime.security.login.ip-window-seconds=${LOGIN_IP_WINDOW_SECONDS:60}
beyondtime.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8081,http://localhost:8085,http://127.0.0.1:8085,http://bytime.me,https://bytime.me,http://www.bytime.me,https://www.bytime.me,http://132.226.242.158:8085}
beyondtime.security.firebase.project-id=${FIREBASE_PROJECT_ID:}

# SMTP — Envio de E-mail de Recuperação de Senha (RF01)
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
beyondtime.mail.from=${BEYONDTIME_MAIL_FROM:nao-responda@beyondtime.com.br}
