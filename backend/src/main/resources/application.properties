server.port=8080

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/beyondtime_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:beyondtime_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:beyondtime_dev_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway — Versionamento de Migrations (V1 Schema 5FN + V2 Seeds Sergipe/Hobbies)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Desativa o schema.sql legado para o Flyway assumir 100% do controle sem duplicidade
spring.sql.init.mode=never

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# RF11 — Biometria Facial & Selo de Verificado 50+
# Mesma chave secreta configurada no microserviço Python (reconhecimento-facial)
beyondtime.biometrics.jwt.secret=${BIOMETRIA_JWT_SECRET_KEY:}

