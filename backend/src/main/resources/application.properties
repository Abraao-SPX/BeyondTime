server.port=8080

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/beyondtime_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:beyondtime_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:beyondtime_dev_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.sql.init.mode=never

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# RF01 — Segurança JWT, Sessão Persistente (365d) e Recuperação de Senha
beyondtime.security.jwt.secret=${JWT_SECRET_KEY:beyondtime_dev_secret_key_for_local_testing_minimum_256_bits_2026_uninassau}
beyondtime.security.jwt.access-token-expiration-minutes=${JWT_ACCESS_EXPIRATION_MINUTES:15}
beyondtime.security.jwt.refresh-token-expiration-days=${JWT_REFRESH_EXPIRATION_DAYS:365}
beyondtime.security.password-reset.expiration-minutes=${PASSWORD_RESET_EXPIRATION_MINUTES:15}
beyondtime.security.password-reset.expose-debug-code=${PASSWORD_RESET_EXPOSE_DEBUG_CODE:false}
beyondtime.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8081}
