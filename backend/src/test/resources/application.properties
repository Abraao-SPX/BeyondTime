spring.profiles.active=test

spring.datasource.url=jdbc:h2:mem:beyondtime_db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/test-migration
spring.sql.init.mode=never

beyondtime.security.jwt.secret=beyondtime_test_secret_key_minimum_256_bits_for_testing_purposes_2026
beyondtime.biometrics.jwt.secret=beyondtime_test_biometric_secret_key_minimum_256_bits_for_testing_2026
beyondtime.security.jwt.access-token-expiration-minutes=15
beyondtime.security.jwt.refresh-token-expiration-days=365
beyondtime.security.password-reset.expiration-minutes=15
beyondtime.security.password-reset.expose-debug-code=true
beyondtime.security.login.trust-forwarded-headers=true
beyondtime.security.firebase.project-id=beyondtime-test
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
beyondtime.uploads.avatars-dir=${java.io.tmpdir}/beyondtime-test-avatars
