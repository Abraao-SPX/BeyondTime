services:
  # ==========================================
  # 0. Banco de Dados Relacional (PostgreSQL 16 — RF04)
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: beyondtime-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-beyondtime_db}
      POSTGRES_USER: ${POSTGRES_USER:-beyondtime_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-beyondtime_dev_pass}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-beyondtime_user} -d ${POSTGRES_DB:-beyondtime_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ==========================================
  # 1. Reconhecimento Facial & Prova de Vida (RF11)
  #    YuNet + SFace + MiniFASNetV2 + flash espectral
  # ==========================================
  reconhecimento-facial:
    build:
      context: ./reconhecimento-facial/backend
      dockerfile: Dockerfile
    container_name: beyondtime-reconhecimento-facial
    ports:
      - "${BIOMETRIA_PORT:-8000}:8000"
    restart: unless-stopped
    environment:
      # Chave HS256 do token biométrico (validado pelo backend Java para o Selo 50+).
      # Se vazia, o serviço gera uma chave efêmera (só serve para testes locais).
      JWT_SECRET_KEY: ${BIOMETRIA_JWT_SECRET_KEY:-}
      CORS_ALLOWED_ORIGINS: ${BIOMETRIA_CORS_ALLOWED_ORIGINS:-*}
    volumes:
      # Embeddings (SQLite) e recortes faciais persistidos fora do container
      - biometria_data:/app/storage

  # ==========================================
  # 2. Inteligência Artificial Anti-Fraude (NLP)
  # ==========================================
  anjo-da-guarda:
    build:
      context: ./ml-antifraude
      dockerfile: Dockerfile
    container_name: beyondtime-ia
    ports:
      - "8001:8000"
    restart: unless-stopped

  # ==========================================
  # 3. Backend Principal (Java Spring Boot)
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: beyondtime-backend
    ports:
      - "8080:8080"
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-beyondtime_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-beyondtime_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-beyondtime_dev_pass}
      # Chave de validação dos tokens biométricos (HS256)
      BIOMETRIA_JWT_SECRET_KEY: ${BIOMETRIA_JWT_SECRET_KEY:-troque_por_uma_chave_biometrica_aleatoria_de_32_bytes_ou_mais}
    depends_on:
      postgres:
        condition: service_healthy
      anjo-da-guarda:
        condition: service_started
      reconhecimento-facial:
        condition: service_started

volumes:
  postgres_data:
  biometria_data:
