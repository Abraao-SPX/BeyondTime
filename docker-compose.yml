services:
  # ==========================================
  # 1. Reconhecimento Facial & Liveness (IA)
  # ==========================================
  face-api:
    build:
      context: ./face-api
      dockerfile: Dockerfile
    container_name: beyondtime-face-api
    ports:
      - "8000:8000"
    restart: unless-stopped
    environment:
      - FACE_MATCH_THRESHOLD=0.60
      - LIVENESS_THRESHOLD=0.80
      - SAVE_TEST_IMAGES=false

  # ==========================================
  # 2. Inteligência Artificial Anti-Fraude (NLP)
  # ==========================================
  anjo-da-guarda:
    build:
      context: ./ml-antifraude
      dockerfile: Dockerfile
    container_name: beyondtime-ia
    ports:
      - "8001:8000"
    restart: unless-stopped

  # ==========================================
  # 3. Backend Principal (Java Spring Boot)
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: beyondtime-backend
    ports:
      - "8080:8080"
    restart: unless-stopped
    depends_on:
      - anjo-da-guarda
      - face-api
